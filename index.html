<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAG Routine Builder</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Essential Layout Fixes */
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; gap: 20px; }
        .main-content { flex: 1; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sidebar { width: 300px; background: white; padding: 20px; border-radius: 8px; border: 2px solid #3498db; box-shadow: 0 4px 10px rgba(0,0,0,0.1); height: fit-content; position: sticky; top: 20px; }
        .form-group { margin-bottom: 15px; }
        .skill-box { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; border-left: 4px solid #3498db; }
        .mag-controls { margin-top: 20px; padding: 15px; background: #fff5f5; border-radius: 8px; }
        .pdf-link { margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

    <!-- Main Entry Area -->
    <main class="main-content">
        <h2>MAG Routine Builder</h2>
        
        <form id="skill-form">
            <div class="form-group">
                <label for="event">Select MAG Event:</label>
                <select id="event" name="event">
                    <option value="">-- Select Event --</option>
                    <option value="fx">Floor Exercise</option>
                    <option value="ph">Pommel Horse</option>
                    <option value="sr">Still Rings</option>
                    <option value="vt">Vault</option>
                    <option value="pb">Parallel Bars</option>
                    <option value="hb">Horizontal Bar</option>
                </select>
            </div>

            <div class="form-group">
                <label for="num-skills">Number of skills:</label>
                <input type="number" id="num-skills" min="1" max="15" value="10">
                <button type="button" id="start-routine-btn" onclick="startRoutine()">Start Routine</button>
                <label for="gym-level">Select Level:</label>
                <select id="gym-level" onchange="calculateTotalStartValue()">
                    <option value="10">Level 10 / Elite (Top 10)</option>
                    <option value="9">Level 9 (Top 8)</option>
                    <option value="8">Level 8 (Top 6)</option>
                </select>
            </div>
        </form>

        <div id="skill-routine">
            <h3>Routine Skills</h3>
            <div id="skill-boxes">
                <!-- Skills dynamically loaded here -->
            </div>
            <button id="add-skill-btn" type="button" onclick="addNewSkill()" style="margin-top: 10px;">+ Add Skill</button>
        </div>

        <div class="mag-controls">
            <h4>Bonus & Penalties</h4>
            <div class="form-group">
                <label><input type="checkbox" id="jo-scoring-toggle" onchange="calculateTotalStartValue()"> Enable JO Scoring (Base 10.0)</label>
            </div>
            <div class="form-group">
                <label>Connection Bonus (CV): </label>
                <input type="number" id="cv-bonus" step="0.1" value="0.0" onchange="calculateTotalStartValue()">
            </div>
            <div class="form-group">
                <label>Neutral Deductions (ND): </label>
                <input type="number" id="neutral-deductions" step="0.1" value="0.0" onchange="calculateTotalStartValue()" style="color: red;">
            </div>
        </div>

        <div class="pdf-link">
            <a href="TrimmedCoP2025-2028.pdf" target="_blank">📄 View MAG Code of Points (2025-2028)</a>
        </div>
    </main>

    <!-- The Scorecard Sidebar -->
    <aside class="sidebar">
        <h3 style="margin-top: 0; color: #2c3e50;">Judge's Scorecard</h3>
        <hr>
        <div id="breakdown-list">
            <p style="color: #999;">Start a routine to see breakdown...</p>
        </div>
        <hr>
        <div style="font-size: 1.4em; font-weight: bold; color: #2c3e50; display: flex; justify-content: space-between;">
            <span>Total SV:</span>
            <span id="total-start-value">0.0</span>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
